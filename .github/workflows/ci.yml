# CI for the stock-VS-Code Isabelle client.
#
# Three jobs, covering three different things:
#
#   build        the tree compiles and the pure suites pass, on all three platforms
#   integration  a real prover starts and the regression passes, on all three platforms
#   package      the .vsix builds
#
# The integration job is the one that matters for platform confidence. Before it existed,
# no prover had ever been launched anywhere but the author's Windows machine, so `build`
# green meant only "the non-Windows code paths are consistent" -- it could not catch a
# launch that fails on Linux, which is exactly where serverPath's Cygwin conversion must
# *not* apply.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The version itself lives in the matrix bundle names below -- the env context is not
  # available in strategy.matrix, so it cannot be factored out to here.
  #
  # NOT https://isabelle.in.tum.de/dist. That host answers every bundle with a 301 to
  # *http* on this one, and curl will not follow an https->http downgrade -- it writes the
  # 372-byte redirect body and then stalls, which is what the first run of this job did.
  # Permitting the downgrade does not help either: plain http on that host does not serve.
  # https straight to the redirect target does, so go there directly.
  ISABELLE_DIST: https://dist.isabelle.cit.tum.de/dist

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      # Pure suites: no editor, no prover, so they mean the same thing everywhere.
      - run: npm run test:unit

  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: Isabelle2025-2_linux.tar.gz
          - os: macos-latest
            bundle: Isabelle2025-2_macos.tar.gz
          - os: windows-latest
            bundle: Isabelle2025-2.exe
    runs-on: ${{ matrix.os }}
    # The bundles are 1.0-1.6 GB and the prover suites are not quick. Generous, because
    # the failure this job exists to catch looks like a hang.
    timeout-minutes: 90
    defaults:
      run:
        # Git Bash on Windows, so find/curl/cygpath work the same way everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile

      # ~2 GB unpacked. Worth caching both to keep the job quick and to avoid pulling a
      # gigabyte off a university server on every push.
      - name: Cache the Isabelle distribution
        id: isabelle-cache
        uses: actions/cache@v4
        with:
          path: ~/isabelle-dist
          key: isabelle-${{ matrix.os }}-${{ matrix.bundle }}

      - name: Download and unpack Isabelle
        if: steps.isabelle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/isabelle-dist
          curl -fL --retry 3 --retry-delay 10 --connect-timeout 30 \
            "$ISABELLE_DIST/${{ matrix.bundle }}?token=Isabelle" -o /tmp/isabelle-bundle
          case "${{ matrix.bundle }}" in
            # The Windows bundle is a self-extracting 7z, so 7z unpacks it without running
            # it. 7-Zip is preinstalled on the runner.
            *.exe) 7z x -y -o"$HOME/isabelle-dist" /tmp/isabelle-bundle > /dev/null ;;
            *)     tar -xzf /tmp/isabelle-bundle -C ~/isabelle-dist ;;
          esac
          rm /tmp/isabelle-bundle

      # Found rather than hardcoded: the Linux bundle unpacks to a plain directory, the
      # macOS one to an .app with the distribution nested inside, and the Windows one to
      # whatever the archive happens to hold. bin/isabelle beside etc/symbols is what the
      # extension itself looks for (isDistribution), so this locates the same thing.
      - name: Locate the distribution
        run: |
          # No pipefail: `find | head -1` makes find die of SIGPIPE once head
          # has its line, and pipefail would report that as a failed step.
          set -eu
          home=$(dirname "$(dirname "$(find ~/isabelle-dist -path '*/bin/isabelle' | head -1)")")
          if [ -z "$home" ] || [ ! -f "$home/etc/symbols" ]; then
            echo "no Isabelle distribution under ~/isabelle-dist"; find ~/isabelle-dist -maxdepth 2; exit 1
          fi
          echo "ISABELLE_POSIX=$home" >> "$GITHUB_ENV"
          # The extension is a Node app and wants a native path.
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "ISABELLE_HOME=$(cygpath -w "$home")" >> "$GITHUB_ENV"
          else
            echo "ISABELLE_HOME=$home" >> "$GITHUB_ENV"
          fi

      # A released Windows bundle ships Cygwin uninitialized: symlinks are stripped into
      # contrib/cygwin/isabelle/symlinks and a marker file `uninitialized` is left behind.
      # Environment.cygwin_init restores them and runs rebaseall + postinstall, but it runs
      # from the Java launcher -- and this extension starts the server by calling
      # contrib/cygwin/bin/bash.exe directly, which bypasses it. A user never notices,
      # because the installer already initialized the copy on disk. Here nothing has, so
      # call it explicitly. It is a no-op once the marker is gone.
      - name: Initialize Cygwin
        if: runner.os == 'Windows'
        run: |
          set -eu
          java=$(find "$ISABELLE_POSIX/contrib" -path '*x86_64-windows/bin/java.exe' | head -1)
          jar=$(find "$ISABELLE_POSIX/contrib" -name isabelle_setup.jar | head -1)
          [ -n "$java" ] && [ -n "$jar" ] || { echo "bundled JDK or setup jar missing"; exit 1; }
          # Call Environment.cygwin_init directly, through Java's single-file source mode.
          # Going via `Setup classpath` instead reaches it only as a side effect of
          # Environment.init and then dies in Build.classpath with
          # NoClassDefFoundError: dotty/tools/dotc/interfaces/SimpleReporter -- every
          # Setup operation needs the Scala compiler, which the setup jar alone does not
          # carry. Depending on a command that happens to do the useful work before
          # crashing is not a fixture worth having.
          src="$RUNNER_TEMP/CygwinInit.java"
          cat > "$src" <<'JAVA'
          public class CygwinInit {
              public static void main(String[] args) throws Exception {
                  isabelle.setup.Environment.cygwin_init(args[0], args[1]);
              }
          }
          JAVA
          "$java" -cp "$(cygpath -w "$jar")" "$(cygpath -w "$src")" \
                  "$ISABELLE_HOME" "$ISABELLE_HOME\\contrib\\cygwin"
          echo "Cygwin initialized"

      # The release ships prebuilt Pure and HOL images, which is what makes this job
      # affordable: building HOL from source would cost half an hour before the first
      # assertion. If a future bundle stops shipping them the suites would still pass but
      # take vastly longer, so fail loudly here instead.
      - name: Check the prebuilt heaps are there
        run: |
          set -eu
          ls -la "$ISABELLE_POSIX/heaps/"*/ || { echo "no prebuilt heap images"; exit 1; }

      # Two at a time: a suite is a whole VS Code plus a JVM and a Poly/ML process, and
      # these runners have far fewer cores than the machine the default was chosen on.
      # Oversubscribing turns the suites' timeouts into coin flips.
      # Fetch the editor once, before anything runs in parallel. runAll starts two suites
      # at a time and each calls runTests, which downloads VS Code into .vscode-test on
      # first use; two concurrent first-time downloads into one cache directory deadlock.
      # That is what hung the macOS job for 28 minutes -- its cleanup reported an orphan
      # `unzip` still running.
      - name: Pre-download the test editor
        run: node -e "require('@vscode/test-electron').downloadAndUnzipVSCode().then(p => console.log(p))"

      - name: Integration suites
        env:
          ISABELLE_TEST_JOBS: 2
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a node test/runAll.js
          else
            node test/runAll.js
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run package
      # Packaging is itself a test: vsce fails on a missing contribution path, so a
      # grammar or language-configuration dropped from .vscodeignore is caught here
      # rather than by someone installing the result.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: isabelle-pide-stock.vsix

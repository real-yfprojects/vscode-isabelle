# CI for the stock-VS-Code Isabelle client.
#
# Four jobs, covering four different things:
#
#   build        the tree compiles and the pure suites pass, on all three platforms
#   integration  a real prover starts and the regression passes, on all three platforms and
#                for every supported release (Isabelle2025-2, Isabelle2026), the extended
#                server's suites included -- in shards, two per platform, three on macOS.
#                Each shard installs the release as a user would, and one per platform
#                and release checks that the extension finds that installation unaided
#   server-jar   the extended server builds from its pinned commit, for each release
#   package      the .vsix builds, with every release's extended server compiled into it
#
# The integration job is the one that matters for platform confidence. Before it existed,
# no prover had ever been launched anywhere but the author's Windows machine, so `build`
# green meant only "the non-Windows code paths are consistent" -- it could not catch a
# launch that fails on Linux, which is exactly where serverPath's Cygwin conversion must
# *not* apply.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs all of this on a release tag and publishes the `vsix` artifact, so
  # what ships is exactly what passed.
  workflow_call:

env:
  # Where each release's bundles come from, by release: ISABELLE_MIRRORS_<release> with
  # `-` as `_`. The releases themselves live in the matrices below -- the env context is
  # not available in strategy.matrix, so they cannot be factored out to here.
  #
  # The website archive of the release first, not the download hosts. Those serve only the
  # *current* release: since Isabelle2026, Cambridge answers Isabelle2025-2 with 404,
  # and https://isabelle.in.tum.de/dist redirects to an http host (curl would not follow
  # the https->http downgrade anyway). The archive at website-<release>/dist keeps every
  # release's bundles over https, the current one's too, and keeps them once it is
  # superseded. For the current release, the dist host it redirects to answers over https
  # as a second choice.
  #
  # Lists, tried in order. The cache in front of every download means a dead host only
  # fails the jobs whose cache was evicted (GitHub drops a cache unused for 7 days).
  ISABELLE_MIRRORS_Isabelle2025_2: >-
    https://isabelle.in.tum.de/website-Isabelle2025-2/dist
  ISABELLE_MIRRORS_Isabelle2026: >-
    https://isabelle.in.tum.de/website-Isabelle2026/dist
    https://dists.isabelle.cit.tum.de/dist

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      # Pure suites: no editor, no prover, so they mean the same thing everywhere.
      - run: npm run test:unit

  integration:
    needs: server-jar
    # Each platform's suites in shards on several runners (test/runAll.js splits them by
    # how long they take): the macOS job, the longest, took 20 min alone. macOS gets three,
    # its runners being the slowest and the most uneven; suite36 alone, about 330 s there,
    # sets how short a shard can get. Every suite still gets an editor and a prover of its
    # own; shards only add runners, which are free for this repository.
    #
    # Isabelle2026 splits macOS into an Intel and an Apple Silicon bundle, and Rosetta-run
    # Java is explicitly unsupported; macos-latest runners are Apple Silicon, so _macos_arm.
    name: integration (${{ matrix.release }}, ${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: Isabelle2026, os: ubuntu-latest, bundle: Isabelle2026_linux.tar.gz, shard: 1, shards: 2 }
          - { release: Isabelle2026, os: ubuntu-latest, bundle: Isabelle2026_linux.tar.gz, shard: 2, shards: 2 }
          - { release: Isabelle2026, os: macos-latest, bundle: Isabelle2026_macos_arm.tar.gz, shard: 1, shards: 3 }
          - { release: Isabelle2026, os: macos-latest, bundle: Isabelle2026_macos_arm.tar.gz, shard: 2, shards: 3 }
          - { release: Isabelle2026, os: macos-latest, bundle: Isabelle2026_macos_arm.tar.gz, shard: 3, shards: 3 }
          - { release: Isabelle2026, os: windows-latest, bundle: Isabelle2026.exe, shard: 1, shards: 2 }
          - { release: Isabelle2026, os: windows-latest, bundle: Isabelle2026.exe, shard: 2, shards: 2 }
          - { release: Isabelle2025-2, os: ubuntu-latest, bundle: Isabelle2025-2_linux.tar.gz, shard: 1, shards: 2 }
          - { release: Isabelle2025-2, os: ubuntu-latest, bundle: Isabelle2025-2_linux.tar.gz, shard: 2, shards: 2 }
          - { release: Isabelle2025-2, os: macos-latest, bundle: Isabelle2025-2_macos.tar.gz, shard: 1, shards: 3 }
          - { release: Isabelle2025-2, os: macos-latest, bundle: Isabelle2025-2_macos.tar.gz, shard: 2, shards: 3 }
          - { release: Isabelle2025-2, os: macos-latest, bundle: Isabelle2025-2_macos.tar.gz, shard: 3, shards: 3 }
          - { release: Isabelle2025-2, os: windows-latest, bundle: Isabelle2025-2.exe, shard: 1, shards: 2 }
          - { release: Isabelle2025-2, os: windows-latest, bundle: Isabelle2025-2.exe, shard: 2, shards: 2 }
    runs-on: ${{ matrix.os }}
    # The bundles are 1.0-1.6 GB and the prover suites are not quick. Generous, because
    # the failure this job exists to catch looks like a hang.
    timeout-minutes: 90
    defaults:
      run:
        # Git Bash on Windows, so find/curl/cygpath work the same way everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      # Without the jar, the suites for the experimental panels would skip themselves. All
      # releases' jars, as the package has them; the extension picks the one for the
      # distribution it finds.
      - uses: actions/download-artifact@v4
        with:
          pattern: server-jar-*
          merge-multiple: true
          path: server

      # The release as downloaded, cached rather than downloaded on every push: the
      # bundles are 1.0-1.6 GB, and a university server should not serve them to every
      # run. The archive, not the unpacked tree: the installation is what is under test
      # (below), and an archive is the smaller entry -- the unpacked trees of six bundles
      # were enough to have GitHub evict main's entries under its 10 GB limit.
      #
      # Restored everywhere, saved on main only. A run reads the caches of its own ref and
      # of main, so with the plain actions/cache every branch and release tag saved its own
      # copy, and the least recently used entries -- main's among them -- were evicted.
      - name: Restore the Isabelle download
        id: isabelle-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/isabelle-download
          key: isabelle-download-${{ matrix.os }}-${{ matrix.bundle }}

      - name: Download Isabelle
        if: steps.isabelle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/isabelle-download
          # A command tested by `if` does not trip set -e, so a dead mirror only
          # moves on to the next one; the final test fails the step if none served.
          release='${{ matrix.release }}'
          mirrors="ISABELLE_MIRRORS_${release//-/_}"
          ok=
          for base in ${!mirrors}; do
            if curl -fL --retry 4 --retry-delay 15 --retry-all-errors --connect-timeout 30 \
                 "$base/${{ matrix.bundle }}?token=Isabelle" -o ~/isabelle-download/part; then
              ok=1; break
            fi
            echo "::warning::$base did not serve ${{ matrix.bundle }}, trying the next mirror"
          done
          test -n "$ok"
          mv ~/isabelle-download/part ~/isabelle-download/${{ matrix.bundle }}

      - name: Save the Isabelle download
        if: steps.isabelle-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/isabelle-download
          key: isabelle-download-${{ matrix.os }}-${{ matrix.bundle }}

      # As Isabelle's installation instructions have it, into the place each platform's
      # installer or instructions suggest -- which is where the extension's search has to
      # find it (suite74, below):
      #
      #   macOS    the .app unpacked into /Applications (what dragging it there does)
      #   Linux    the folder unpacked into the home directory
      #   Windows  the self-extracting installer, run from Downloads, where a browser saves
      #            it, with its defaults. Two kinds:
      #            - up to Isabelle2025-2, the 7zsd module with a config block: -y takes its
      #              defaults without asking, -ai runs its AutoInstall
      #              (`Isabelle2025-2.exe -init`, which initializes the bundled Cygwin)
      #              instead of its RunProgram, which would open jEdit. Its InstallPath is
      #              %UserDesktop%.
      #            - from Isabelle2026, plain 7-Zip's 7z.sfx: it offers the folder the .exe
      #              is in, which -y takes, and does nothing else. The Cygwin stays
      #              uninitialized -- symlinks stripped, a marker file `uninitialized` --
      #              until Isabelle2026.exe first runs, or the extension sets it up itself
      #              (cygwinUninitialized), which suite74 then has to have done.
      #            Before, CI unpacked the bundle with 7z and called Environment.cygwin_init
      #            by hand, so a server started from a real installation was never tested.
      - name: Install Isabelle
        timeout-minutes: 15
        run: |
          set -euo pipefail
          release='${{ matrix.release }}'
          archive=~/isabelle-download/${{ matrix.bundle }}
          case "${{ runner.os }}" in
            macOS)
              # An admin user, which the runner's is, can write to /Applications; sudo
              # only should that change, as it leaves the files owned by root.
              if [ -w /Applications ]; then tar -xzf "$archive" -C /Applications
              else sudo tar -xzf "$archive" -C /Applications; fi
              root="/Applications/$release.app" ;;
            Linux)
              tar -xzf "$archive" -C ~
              root="$HOME/$release" ;;
            Windows)
              downloads="$(cygpath -u "$USERPROFILE")/Downloads"
              mkdir -p "$downloads"
              mv "$archive" "$downloads/"
              cd "$downloads"
              head -c 4000000 "${{ matrix.bundle }}" > "$RUNNER_TEMP/sfx-head"
              if grep -aq ';!@Install@!' "$RUNNER_TEMP/sfx-head"; then
                "./${{ matrix.bundle }}" -y -ai
                root="$(cygpath -u "$USERPROFILE")/Desktop/$release"
                # Done is when nothing runs from the installation any more. Neither the
                # installer nor the launcher it starts is a signal: `-init` hands over to the
                # launcher's JVM and returns, and that JVM goes on with cygwin_init, which
                # runs Cygwin's dash, bash, find and chmod for minutes. Nor is the marker
                # file: cygwin_init deletes it first, and postinstall makes every script
                # mode 644 and only gives the executables their x back at its very end. A
                # server started in between exits 126, from `exec isabelle java` in
                # bin/isabelle (seen on two runs; on another the marker was still there).
                for _ in $(seq 600); do
                  tasklist //FI "IMAGENAME eq $release.exe" | grep -qi "$release.exe" || break
                  sleep 1
                done
                root_win="$(cygpath -w "$root")"
                running() {
                  powershell -NoProfile -Command "Get-Process | Where-Object { \$_.Path -and \$_.Path.StartsWith('$root_win\\', 'OrdinalIgnoreCase') } | ForEach-Object { \$_.Name }" | tr -d '\r'
                }
                waited=0
                while [ -n "$(running)" ]; do
                  [ $((waited % 30)) -eq 0 ] && echo "still setting up Cygwin after ${waited}s: $(running | sort | uniq -c | tr -s ' \n' ' ')"
                  if [ "$waited" -ge 600 ]; then echo "Cygwin's setup still running after ${waited}s"; exit 1; fi
                  sleep 5; waited=$((waited + 5))
                done
                echo "Cygwin's setup ended after ${waited}s more"
                if [ -e "$root/contrib/cygwin/isabelle/uninitialized" ]; then
                  echo "the installer left Cygwin uninitialized"; exit 1
                fi
                # What the server's start goes through, bin/isabelle running a tool, in the
                # Cygwin the installer set up.
                if ! "$root/contrib/cygwin/bin/bash.exe" -l -c '"$(cygpath -u "$1")/bin/isabelle" getenv -b ISABELLE_HOME' _ "$root_win"; then
                  echo "bin/isabelle does not run in the installed Cygwin"
                  "$root/contrib/cygwin/bin/bash.exe" -l -c 'ls -l "$(cygpath -u "$1")/bin/isabelle" "$(cygpath -u "$1")/lib/Tools/getenv"' _ "$root_win" || true
                  exit 1
                fi
              else
                "./${{ matrix.bundle }}" -y
                root="$downloads/$release"
                if [ ! -e "$root/contrib/cygwin/isabelle/uninitialized" ]; then
                  echo "expected the installer to leave Cygwin for the extension to set up"; exit 1
                fi
              fi ;;
          esac
          [ -d "$root" ] || { echo "nothing installed at $root"; ls -la "$(dirname "$root")"; exit 1; }
          echo "ISABELLE_INSTALLED=$root" >> "$GITHUB_ENV"

      # Found rather than hardcoded: Linux and Windows install a plain directory, an
      # Isabelle2025-2.app is the distribution itself, and an Isabelle2026.app has it in
      # Contents/Resources (with symlinks at its root, which find does not follow).
      # bin/isabelle beside etc/symbols is what the extension itself looks for
      # (isDistribution), so this locates the same thing.
      - name: Locate the distribution
        run: |
          # No pipefail: `find | head -1` makes find die of SIGPIPE once head
          # has its line, and pipefail would report that as a failed step.
          set -eu
          home=$(dirname "$(dirname "$(find "$ISABELLE_INSTALLED" -maxdepth 4 -path '*/bin/isabelle' | head -1)")")
          if [ -z "$home" ] || [ ! -f "$home/etc/symbols" ]; then
            echo "no Isabelle distribution under $ISABELLE_INSTALLED"; find "$ISABELLE_INSTALLED" -maxdepth 2; exit 1
          fi
          echo "ISABELLE_POSIX=$home" >> "$GITHUB_ENV"
          # The extension is a Node app and wants a native path.
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "ISABELLE_HOME=$(cygpath -w "$home")" >> "$GITHUB_ENV"
          else
            echo "ISABELLE_HOME=$home" >> "$GITHUB_ENV"
          fi

      # The release ships prebuilt Pure and HOL images, which is what makes this job
      # affordable: building HOL from source would cost half an hour before the first
      # assertion. If a future bundle stops shipping them the suites would still pass but
      # take vastly longer, so fail loudly here instead.
      - name: Check the prebuilt heaps are there
        run: |
          set -eu
          ls -la "$ISABELLE_POSIX/heaps/"*/ || { echo "no prebuilt heap images"; exit 1; }

      # Two at a time: a suite is a whole VS Code plus a JVM and a Poly/ML process, and
      # these runners have far fewer cores than the machine the default was chosen on.
      # Oversubscribing turns the suites' timeouts into coin flips.
      # Fetch the editor once, before anything runs in parallel. runAll starts two suites
      # at a time and each calls runTests, which downloads VS Code into .vscode-test on
      # first use; two concurrent first-time downloads into one cache directory deadlock.
      # That is what hung the macOS job for 28 minutes -- its cleanup reported an orphan
      # `unzip` still running.
      #
      # A single download can hang too: on macOS one ran past ten minutes against its usual
      # 20 s. fetch-editor.js gives each attempt three minutes and tries four times; the step
      # limit is a backstop should the script itself ever stick.
      #
      # Cached, and for more than speed: before any download @vscode/test-electron asks
      # update.code.visualstudio.com which version "stable" is, and that request timed out
      # on 4 of 12 runners at once. With an editor already there, the library uses it when
      # the question goes unanswered. The newest entry is restored; main saves one whenever
      # the editor it ends up with is another version, so there is one per release of it.
      - name: Restore the test editor
        id: editor-cache
        uses: actions/cache/restore@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-restore
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Pre-download the test editor
        id: editor
        timeout-minutes: 14
        run: |
          set -eu
          exe=$(node test/fetch-editor.js)
          # Handed to runTest.js, which repairs it if the library's guess is wrong.
          echo "VSCODE_TEST_EXECUTABLE=$exe" >> "$GITHUB_ENV"
          echo "editor: $exe"
          # The version's directory, e.g. vscode-darwin-arm64-1.146.0, names the cache entry;
          # older versions go, so an entry holds one editor.
          rel=$(printf '%s' "$exe" | sed 's|\\|/|g'); rel=${rel#*.vscode-test/}; version=${rel%%/*}
          for d in .vscode-test/vscode-*; do [ "$(basename "$d")" = "$version" ] || rm -rf "$d"; done
          echo "key=vscode-test-${{ runner.os }}-$version" >> "$GITHUB_OUTPUT"

      - name: Save the test editor
        if: github.ref == 'refs/heads/main' && steps.editor-cache.outputs.cache-matched-key != steps.editor.outputs.key
        uses: actions/cache/save@v4
        with:
          path: .vscode-test
          key: ${{ steps.editor.outputs.key }}

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Every other suite is handed ISABELLE_HOME, which the extension takes before it looks
      # anywhere -- so for a long time nothing ran its search, and it could not find a macOS
      # installation at all. This one is not: with no setting and no variable, the extension
      # has to find the installation from "Install Isabelle" on its own, start a server from
      # it and check a theory. Once per platform and release, as the search is the same in
      # every shard -- and on every Windows shard, before the other suites: there it may
      # also have to set up the Cygwin the Isabelle2026 installer leaves uninitialized, and
      # two suites starting at once would both try.
      - name: Find the installation unaided
        if: matrix.shard == 1 || runner.os == 'Windows'
        run: |
          set -eu
          export ISABELLE_TEST_EXPECT_HOME="$ISABELLE_HOME"
          unset ISABELLE_HOME
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a node test/runAll.js suite74
          else
            node test/runAll.js suite74
          fi

      - name: Integration suites
        env:
          ISABELLE_TEST_JOBS: 2
          ISABELLE_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a node test/runAll.js
          else
            node test/runAll.js
          fi

  # The extended server, built once per release. The jar is JVM bytecode and the same on
  # every platform, so the integration jobs test the very jars the package ships. Each is
  # compiled from the mirror-isabelle commit in server/<IDENTIFIER>.ref with the toolchain
  # of the release it targets, so this job needs that release too -- under the same cache
  # key as the Linux integration job, so usually a cache hit.
  server-jar:
    name: server-jar (${{ matrix.release }})
    strategy:
      fail-fast: false
      matrix:
        release: [Isabelle2026, Isabelle2025-2]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The integration job's Linux download, under the same key, and saved on main only
      # for the same reason.
      - name: Restore the Isabelle download
        id: isabelle-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/isabelle-download
          key: isabelle-download-ubuntu-latest-${{ matrix.release }}_linux.tar.gz

      - name: Download Isabelle
        if: steps.isabelle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/isabelle-download
          release='${{ matrix.release }}'
          mirrors="ISABELLE_MIRRORS_${release//-/_}"
          ok=
          for base in ${!mirrors}; do
            if curl -fL --retry 4 --retry-delay 15 --retry-all-errors --connect-timeout 30 \
                 "$base/${release}_linux.tar.gz?token=Isabelle" -o ~/isabelle-download/part; then
              ok=1; break
            fi
            echo "::warning::$base did not serve the bundle, trying the next mirror"
          done
          test -n "$ok"
          mv ~/isabelle-download/part ~/isabelle-download/${release}_linux.tar.gz

      - name: Save the Isabelle download
        if: steps.isabelle-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/isabelle-download
          key: isabelle-download-ubuntu-latest-${{ matrix.release }}_linux.tar.gz

      # The script only reads the distribution. It fetches the pinned commit itself; that
      # commit must have been pushed.
      - name: Build the extended server
        run: |
          set -eu
          release='${{ matrix.release }}'
          tar -xzf ~/isabelle-download/${release}_linux.tar.gz -C ~
          scripts/build-server-jar.sh "$HOME/$release"
          ls -la server/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: server-jar-${{ matrix.release }}
          path: server/${{ matrix.release }}.jar
          if-no-files-found: error

  package:
    needs: server-jar
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - uses: actions/download-artifact@v4
        with:
          pattern: server-jar-*
          merge-multiple: true
          path: server
      - run: npm run package
      # A .vsix without a jar would install fine and then fall back to the standard server
      # for everyone on that release who turns the setting on, so check each went in.
      - name: Check the extended servers are packaged
        run: |
          set -eu
          for release in Isabelle2026 Isabelle2025-2; do
            unzip -l vscode-isabelle.vsix | grep -F "extension/server/$release.jar"
          done
      # Without its runtime dependencies the extension does not activate at all. Every
      # suite runs it from the checkout, where require() finds the repository's
      # node_modules, so only the package itself can show that they are missing.
      - name: Check the runtime dependencies are packaged
        run: |
          for dep in $(node -p "Object.keys(require('./package.json').dependencies).join(' ')"); do
            unzip -l vscode-isabelle.vsix | grep -F "extension/node_modules/$dep/package.json"
          done
      # Packaging is itself a test: vsce fails on a missing contribution path, so a
      # grammar or language-configuration dropped from .vscodeignore is caught here
      # rather than by someone installing the result.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-isabelle.vsix
